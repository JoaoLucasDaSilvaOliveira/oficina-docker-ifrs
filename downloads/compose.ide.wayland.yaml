name: oficina-ide
services:
  ide:
    image: joaolsodocker/oficina-ide:1.0.0
    user: "${LOCAL_UID:?Exporte LOCAL_UID com id -u}:${LOCAL_GID:?Exporte LOCAL_GID com id -g}"
    container_name: ide
    init: true
    environment:
      XDG_RUNTIME_DIR: /tmp/runtime-aluno
      WAYLAND_DISPLAY: wayland-0
    volumes:
      - type: bind
        source: ${XDG_RUNTIME_DIR:?Sessão sem XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY:?Sessão sem WAYLAND_DISPLAY}
        target: /tmp/runtime-aluno/wayland-0
        bind:
          create_host_path: false
    command:
      [
        "code",
        "--no-sandbox",
        "--disable-gpu",
        "--ozone-platform=wayland",
        "--new-window",
        "--wait",
        ".",
      ]
    shm_size: 256m
    tmpfs:
      - "/tmp/runtime-aluno:uid=${LOCAL_UID},gid=${LOCAL_GID},mode=0700"
