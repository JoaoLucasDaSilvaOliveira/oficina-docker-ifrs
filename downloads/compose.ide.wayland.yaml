name: oficina-ide
services:
  ide:
    image: joaolsodocker/oficina-ide:1.0.0
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    container_name: ide
    init: true
    environment:
      XDG_RUNTIME_DIR: /tmp/runtime-aluno
      WAYLAND_DISPLAY: wayland-0
    volumes:
      - type: bind
        source: ${WAYLAND_SOCKET:-${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}}
        target: /tmp/runtime-aluno/wayland-0
        bind:
          create_host_path: false
    command:
      [
        "code",
        "--no-sandbox",
        "--disable-gpu",
        "--ozone-platform=wayland",
        "--new-window",
        "--wait",
        ".",
      ]
    shm_size: 256m
    tmpfs:
      - "/tmp/runtime-aluno:uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=0700"
