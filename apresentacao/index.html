<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#102b43" />
    <meta
      name="description"
      content="Oficina Docker: conceitos, experimentos e materiais de estudo."
    />
    <title>Oficina Docker</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="flag-tooltips.css" />
    <script defer src="slides.js"></script>
    <script defer src="quiz.js"></script>
    <script defer src="compose-reference.js"></script>
    <script defer src="docker-reference.js"></script>
    <script defer src="command-search.js"></script>
    <script defer src="guide-index.js"></script>
    <script defer src="flag-tooltips.js"></script>
    <script defer src="diagrams.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#slide">Ir ao slide</a>
    <header class="topbar">
      <div class="identity">
        <button
          id="menu-toggle"
          class="icon-button mobile-menu"
          aria-label="Abrir sumário"
          aria-expanded="false"
          aria-controls="sidebar"
        >
          ☰
        </button>
        <a class="brand" href="#/inicio"
          ><span class="brand-symbol" aria-hidden="true">▤</span> Oficina<span
            class="brand-divider"
            >/</span
          ><strong>Docker</strong></a
        >
      </div>
      <div class="top-actions">
        <button class="text-button" id="commands-button">
          Comandos <kbd>/</kbd>
        </button>
        <button class="text-button" id="resources-button">Materiais</button>
        <button
          class="icon-button"
          id="presentation-button"
          aria-label="Ativar modo de apresentação"
          title="Tela cheia (F)"
        >
          ⛶
        </button>
      </div>
    </header>
    <button
      class="sidebar-scrim"
      id="sidebar-scrim"
      aria-label="Fechar sumário"
      hidden
    ></button>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar" aria-label="Sumário da oficina">
        <div class="sidebar-heading">
          <span>Percurso</span><span id="chapter-count"></span>
        </div>
        <nav id="chapters"></nav>
      </aside>
      <div class="workspace">
        <div class="slide-context"><span id="breadcrumb"></span></div>
        <main
          id="slide"
          class="slide"
          tabindex="-1"
          aria-label="Slide atual"
        ></main>
        <footer class="navigation">
          <button
            id="reference-button"
            class="text-button reference-button"
            aria-haspopup="dialog"
          >
            Referências
          </button>
          <div class="page-nav">
            <button
              id="previous"
              class="icon-button"
              aria-label="Slide anterior"
            >
              ←
            </button>
            <span id="page-count" aria-live="polite" aria-atomic="true"></span>
            <button id="next" class="next-button" aria-label="Próximo slide">
              Próximo <span aria-hidden="true">→</span>
            </button>
          </div>
        </footer>
        <div class="progress-track" aria-hidden="true">
          <div id="progress"></div>
        </div>
      </div>
    </div>
    <dialog
      id="exercise-dialog"
      class="exercise-dialog"
      aria-labelledby="exercise-title"
    >
      <div class="dialog-head">
        <h2 id="exercise-title"></h2>
        <button
          class="icon-button close-dialog"
          aria-label="Fechar comandos do exercício"
        >
          ×
        </button>
      </div>
      <div class="dialog-scroll" id="exercise-content"></div>
    </dialog>
    <dialog
      id="commands-dialog"
      class="drawer"
      aria-labelledby="commands-title"
    >
      <div class="dialog-head">
        <h2 id="commands-title">Comandos do Docker</h2>
        <button
          class="icon-button close-dialog"
          aria-label="Fechar consulta de comandos"
        >
          ×
        </button>
      </div>
      <div class="search-area">
        <label for="command-search">Buscar comando ou flag</label
        ><input
          type="search"
          id="command-search"
          placeholder="ps, exec, compose logs, --tail…"
          autocomplete="off"
        />
        <p class="catalog-version" id="catalog-version"></p>
      </div>
      <div class="dialog-scroll" id="command-results"></div>
    </dialog>
    <dialog
      id="resources-dialog"
      class="drawer"
      aria-labelledby="resources-title"
    >
      <div class="dialog-head">
        <h2 id="resources-title">Materiais</h2>
        <button class="icon-button close-dialog" aria-label="Fechar materiais">
          ×
        </button>
      </div>
      <div class="search-area">
        <label for="material-search">Buscar exercício ou arquivo</label
        ><input
          type="search"
          id="material-search"
          placeholder="IDE, Vue, volume, Dockerfile…"
          autocomplete="off"
        />
      </div>
      <div class="dialog-scroll" id="guide-list"></div>
    </dialog>
    <dialog
      id="reference-dialog"
      class="reference-dialog"
      aria-labelledby="reference-title"
    >
      <div class="dialog-head">
        <h2 id="reference-title">Referências</h2>
        <button
          class="icon-button close-dialog"
          aria-label="Fechar referências"
        >
          ×
        </button>
      </div>
      <div class="dialog-scroll" id="reference-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
