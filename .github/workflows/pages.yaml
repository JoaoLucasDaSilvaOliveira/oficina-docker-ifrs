name: Publicar oficina no GitHub Pages

# Publicação somente por ação explícita do instrutor no painel Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter material de autoria
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Gerar guias, downloads e site público
        run: python3 ferramentas/preparar_materiais.py --site-dir _site
      - name: Preparar artefato público
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
