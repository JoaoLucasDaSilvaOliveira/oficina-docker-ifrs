name: oficina-ide
services:
  ide:
    image: joaolsodocker/oficina-ide:1.0.0
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    container_name: ide
    hostname: ${HOST_HOSTNAME:-oficina-ide}
    init: true
    environment:
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/oficina.xauth
    volumes:
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${XAUTHORITY:-${HOME}/.Xauthority}
        target: /tmp/oficina.xauth
        read_only: true
        bind:
          create_host_path: false
    shm_size: 256m
    tmpfs:
      - "/tmp/runtime-aluno:uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=0700"
